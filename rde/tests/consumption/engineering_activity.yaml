tests:
  - id: ca-prs-opened
    name: PRs opened resolves to PR count and returns data
    targets:
      - card:engineering_activity/prs_opened
    invariant: false
    group: engineering_activity
    layer: consumption
    plan: engineering-activity-dashboard
    outcomeIds:
      - eng-activity
    kind: consumption
    expectation:
      element: PRs opened
      resolvesTo: measure:pr_count
      returnsData: true

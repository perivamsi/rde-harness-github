    expectation:
      check: row_count_equals_other
      other: staging.stg_pr_review_comments
  - id: dc-fct-pr-review-comments-pr-ref
    name: every review comment's pull_request_number is a fct_pull_requests key
    targets:
      - table:github.marts.fct_pr_review_comments
    invariant: false

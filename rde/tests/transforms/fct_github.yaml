tests:
  - id: tt-fct-pull-requests
    name: fct_pull_requests derives is_open and hours_to_merge
    description: "Cases: 1 merged after 36 hours; 2 merged 30 minutes after opening; 3 open, never merged (null hours, is_open); 4 closed without merging (null hours, not open); 5 bot PR kept with is_bot."
    targets:
      - transform:fct_pull_requests
    invariant: false
    group: fct_github
    layer: marts
    plan: engineering-activity-dashboard
    outcomeIds:
      - eng-activity
    kind: transform
    expectation:
      inputs:
        table:github.staging.stg_pull_requests:
          - pull_request_number: 1
            title: a
            state: closed
            is_draft: false
            author_login: alice
            is_bot: false
            base_ref: master
            created_at: 2026-10-01T00:00:00Z
            closed_at: 2026-10-02T12:00:00Z
            merged_at: 2026-10-02T12:00:00Z
            is_merged: true
          - pull_request_number: 2
            title: b
            state: closed
            is_draft: false
            author_login: bob
            is_bot: false
            base_ref: master
            created_at: 2026-10-01T00:00:00Z
            closed_at: 2026-10-01T00:30:00Z
            merged_at: 2026-10-01T00:30:00Z
            is_merged: true
          - pull_request_number: 3
            title: c
            state: open
            is_draft: true
            author_login: carol
            is_bot: false
            base_ref: master
            created_at: 2026-10-01T00:00:00Z
            closed_at: null
            merged_at: null
            is_merged: false
          - pull_request_number: 4
            title: d
            state: closed
            is_draft: false
            author_login: dave
            is_bot: false
            base_ref: master
            created_at: 2026-10-01T00:00:00Z
            closed_at: 2026-10-03T00:00:00Z
            merged_at: null
            is_merged: false
          - pull_request_number: 5
            title: e
            state: open
            is_draft: false
            author_login: dependabot[bot]
            is_bot: true
            base_ref: master
            created_at: 2026-10-01T00:00:00Z
            closed_at: null
            merged_at: null
            is_merged: false
      rows:
        - pull_request_number: 1
          is_open: false
          is_bot: false
          hours_to_merge: 36
        - pull_request_number: 2
          is_open: false
          is_bot: false
          hours_to_merge: 0.5
        - pull_request_number: 3
          is_open: true
          is_bot: false
          hours_to_merge: null
        - pull_request_number: 4
          is_open: false
          is_bot: false
          hours_to_merge: null
        - pull_request_number: 5
          is_open: true
          is_bot: true
          hours_to_merge: null
      ordered: false
  - id: tt-fct-commits
    name: fct_commits keeps every commit with its author and bot flag
    description: "Cases: 1 human commit; 2 bot commit; 3 commit with a null author login must not be lost."
    targets:
      - transform:fct_commits
    invariant: false
    group: fct_github
    layer: marts
    plan: engineering-activity-dashboard
    outcomeIds:
      - eng-activity
    kind: transform
    expectation:
      inputs:
        table:github.staging.stg_commits:
          - commit_sha: a1
            author_login: alice
            committer_login: web-flow
            authored_at: 2026-10-01T00:00:00Z
            is_verified: true
            is_bot: false
          - commit_sha: a2
            author_login: github-actions[bot]
            committer_login: github-actions[bot]
            authored_at: 2026-10-02T00:00:00Z
            is_verified: false
            is_bot: true
          - commit_sha: a3
            author_login: null
            committer_login: null
            authored_at: 2026-10-03T00:00:00Z
            is_verified: false
            is_bot: false
      rows:
        - commit_sha: a1
          author_login: alice
          is_bot: false
        - commit_sha: a2
          author_login: github-actions[bot]
          is_bot: true
        - commit_sha: a3
          author_login: null
          is_bot: false
      ordered: false
  - id: tt-fct-pr-review-comments
    name: fct_pr_review_comments adds the PR author without losing or duplicating comments
    description: "Cases: 1 and 2 two comments on PR 10 each get its author once (no fan-out); 3 comment on PR 99 missing from the PR extract is kept with a null pr_author_login; 4 a PR with no comments adds no row."
    targets:
      - transform:fct_pr_review_comments
    invariant: false
    group: fct_github
    layer: marts
    plan: engineering-activity-dashboard
    outcomeIds:
      - eng-activity
    kind: transform
    expectation:
      inputs:
        table:github.staging.stg_pr_review_comments:
          - review_comment_id: 1
            review_id: 11
            pull_request_number: 10
            reviewer_login: bob
            is_reply: false
            is_bot: false
            created_at: 2026-10-01T00:00:00Z
          - review_comment_id: 2
            review_id: 11
            pull_request_number: 10
            reviewer_login: alice
            is_reply: true
            is_bot: false
            created_at: 2026-10-01T01:00:00Z
          - review_comment_id: 3
            review_id: 12
            pull_request_number: 99
            reviewer_login: coderabbit[bot]
            is_reply: false
            is_bot: true
            created_at: 2026-10-01T02:00:00Z
        table:github.staging.stg_pull_requests:
          - pull_request_number: 10
            author_login: alice
          - pull_request_number: 11
            author_login: carol
      rows:
        - review_comment_id: 1
          pull_request_number: 10
          reviewer_login: bob
          pr_author_login: alice
        - review_comment_id: 2
          pull_request_number: 10
          reviewer_login: alice
          pr_author_login: alice
        - review_comment_id: 3
          pull_request_number: 99
          reviewer_login: coderabbit[bot]
          pr_author_login: null
      ordered: false
  - id: tt-fct-issues
    name: fct_issues derives is_open and hours_to_close
    description: "Cases: 1 open issue (null hours); 2 closed after exactly 24 hours; 3 closed in the same minute (0 hours); 4 bot issue kept with is_bot."
    targets:
      - transform:fct_issues
    invariant: false
    group: fct_github
    layer: marts
    plan: engineering-activity-dashboard
    outcomeIds:
      - eng-activity
    kind: transform
    expectation:
      inputs:
        table:github.staging.stg_issues:
          - issue_number: 1
            title: a
            state: open
            state_reason: null
            author_login: alice
            is_bot: false
            created_at: 2026-10-01T00:00:00Z
            closed_at: null
          - issue_number: 2
            title: b
            state: closed
            state_reason: completed
            author_login: bob
            is_bot: false
            created_at: 2026-10-01T00:00:00Z
            closed_at: 2026-10-02T00:00:00Z
          - issue_number: 3
            title: c
            state: closed
            state_reason: not_planned
            author_login: carol
            is_bot: false
            created_at: 2026-10-01T00:00:00Z
            closed_at: 2026-10-01T00:00:00Z
          - issue_number: 4
            title: d
            state: open
            state_reason: null
            author_login: metabase-bot[bot]
            is_bot: true
            created_at: 2026-10-01T00:00:00Z
            closed_at: null
      rows:
        - issue_number: 1
          is_open: true
          is_bot: false
          hours_to_close: null
        - issue_number: 2
          is_open: false
          is_bot: false
          hours_to_close: 24
        - issue_number: 3
          is_open: false
          is_bot: false
          hours_to_close: 0
        - issue_number: 4
          is_open: true
          is_bot: true
          hours_to_close: null
      ordered: false
  - id: dc-fct-pull-requests-unique
    name: "fct_pull_requests: pull_request_number is unique"
    targets:
      - table:github.marts.fct_pull_requests
    invariant: false
    group: fct_github
    layer: marts
    plan: engineering-activity-dashboard
    outcomeIds:
      - eng-activity
    kind: data-check
    expectation:
      check: unique
      column: pull_request_number
  - id: dc-fct-pull-requests-key-present
    name: "fct_pull_requests: pull_request_number is present"
    targets:
      - table:github.marts.fct_pull_requests
    invariant: false
    group: fct_github
    layer: marts
    plan: engineering-activity-dashboard
    outcomeIds:
      - eng-activity
    kind: data-check
    expectation:
      check: not_null
      column: pull_request_number
  - id: dc-fct-pull-requests-rows
    name: fct_pull_requests has one row per staged pull request
    targets:
      - table:github.marts.fct_pull_requests
    invariant: false
    group: fct_github
    layer: marts
    plan: engineering-activity-dashboard
    outcomeIds:
      - eng-activity
    kind: data-check
    expectation:
      check: row_count_equals_other
      other: staging.stg_pull_requests
  - id: dc-fct-pull-requests-hours-non-negative
    name: "fct_pull_requests: hours_to_merge is never negative (heuristic)"
    targets:
      - table:github.marts.fct_pull_requests
    invariant: false
    group: fct_github
    layer: marts
    plan: engineering-activity-dashboard
    outcomeIds:
      - eng-activity
    kind: data-check
    expectation:
      check: non_negative
      column: hours_to_merge
  - id: dc-fct-commits-unique
    name: "fct_commits: commit_sha is unique"
    targets:
      - table:github.marts.fct_commits
    invariant: false
    group: fct_github
